# SPDX-License-Identifier: GPL-3.0-or-later
# Builds the voice engine the app is installed with: ONNX Runtime as Microsoft publishes it, and eSpeak NG compiled
# here from its source. The release workflow calls it; a manual run builds and tests it only.
name: Engine

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

env:
  ESPEAK_TAG: '1.52.0'
  ORT_VERSION: '1.32.0'
  ORT_SHA256: 'aaa1d04fcf86bd31e84b90bc0cbde80e632bd0720dcc5d8ba05c4fe45c09d127'

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7
      - uses: ilammy/msvc-dev-cmd@v1
      - name: eSpeak NG source
        shell: pwsh
        run: |
          git clone --depth 1 --branch "$env:ESPEAK_TAG" https://github.com/espeak-ng/espeak-ng.git espeak-ng
          New-Item -ItemType Directory -Force dist | Out-Null
          git -C espeak-ng archive --format=tar.gz --prefix="espeak-ng-$env:ESPEAK_TAG/" -o "../dist/espeak-ng-$env:ESPEAK_TAG-source.tar.gz" HEAD
      # A DLL with the C runtime inside it, and with no audio: the app only asks it for phonemes.
      - name: eSpeak NG build
        shell: pwsh
        run: |
          cmake -S espeak-ng -B espeak-build -G "Visual Studio 17 2022" -A x64 `
            -DBUILD_SHARED_LIBS=ON -DCMAKE_POLICY_DEFAULT_CMP0091=NEW -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded `
            -DCMAKE_C_FLAGS="/DLIBESPEAK_NG_EXPORT" -DUSE_ASYNC=OFF -DUSE_MBROLA=OFF -DUSE_LIBSONIC=OFF `
            -DUSE_LIBPCAUDIO=OFF -DUSE_KLATT=OFF -DUSE_SPEECHPLAYER=OFF -DBUILD_TESTING=OFF
          cmake --build espeak-build --config Release --parallel
          $dll = Get-ChildItem espeak-build -Recurse -Filter espeak-ng.dll | Select-Object -First 1
          $exports = dumpbin /exports $dll.FullName
          foreach ($name in 'espeak_Initialize', 'espeak_SetVoiceByName', 'espeak_TextToPhonemes') {
            if (-not ($exports -match $name)) { throw "espeak-ng.dll does not export $name" }
          }
      - name: ONNX Runtime
        shell: pwsh
        run: |
          $url = "https://github.com/microsoft/onnxruntime/releases/download/v$env:ORT_VERSION/onnxruntime-win-x64-$env:ORT_VERSION.zip"
          Invoke-WebRequest $url -OutFile ort.zip
      - name: Engine folder
        shell: pwsh
        run: |
          ./tools/engine-pack.ps1 -EspeakBuild espeak-build -EspeakSource espeak-ng -OrtZip ort.zip `
            -OrtSha256 $env:ORT_SHA256 -OrtVersion $env:ORT_VERSION -EspeakTag $env:ESPEAK_TAG `
            -Redist "$env:VCToolsRedistDir" -Out dist/engine
      # The artifact holds engine/ and the source of eSpeak NG, which goes to the release beside the installer.
      - uses: actions/upload-artifact@v7
        with:
          name: engine
          path: dist
          if-no-files-found: error

  # The tests that load the engine run here only: nobody runs downloaded libraries on a development machine.
  test:
    needs: build
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.99.1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: actions/download-artifact@v8
        with:
          name: engine
          path: dist
      - name: Tests with the engine
        working-directory: src-tauri
        shell: pwsh
        env:
          MOCHIREADER_ENGINE_DIR: ${{ github.workspace }}\dist\engine
        run: cargo test -- --ignored engine_
