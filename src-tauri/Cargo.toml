# SPDX-License-Identifier: GPL-3.0-or-later
[package]
name = "mochireader"
version = "0.1.0"
description = "A Windows reader for Markdown and EPUB files"
edition = "2021"
rust-version = "1.89"
license = "GPL-3.0-or-later"

[lib]
# A library named like the binary collides with it on Windows.
name = "mochireader_lib"

[features]
# Commands that only tools/smoke.ps1 uses. Never in a release.
smoke = []

[build-dependencies]
tauri-build = { version = "=2.7.3", features = [] }

[dependencies]
ammonia = "=4.2.4"
comrak = { version = "=0.59.0", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# custom-protocol: serve the embedded pages from every build, since the app has no dev server.
tauri = { version = "=2.12.4", features = ["custom-protocol"] }
tauri-plugin-dialog = "=2.6.0"
tauri-plugin-single-instance = "=2.5.4"
# Already in the app through Tauri, at this version: named here for the WebView2 settings Tauri does not offer.
webview2-com = "=0.39.1"
windows = { version = "=0.62.2", features = [
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_Security",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
