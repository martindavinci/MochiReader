# SPDX-License-Identifier: GPL-3.0-or-later
[package]
name = "mochireader"
version = "0.1.0"
description = "A Windows reader for Markdown and EPUB files"
edition = "2021"
rust-version = "1.89"
license = "GPL-3.0-or-later"

[lib]
# A library named like the binary collides with it on Windows.
name = "mochireader_lib"

[dependencies]
ammonia = "=4.2.4"
comrak = { version = "=0.59.0", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = "=2.12.4"
